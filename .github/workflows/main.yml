name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Extrair projeto
        run: unzip -q MultiHunt.zip -d src
      - name: Compilar
        run: cd src && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MultiHunt-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
